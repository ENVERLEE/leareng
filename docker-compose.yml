version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: leareng-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: leareng
      MYSQL_USER: leareng
      MYSQL_PASSWORD: learengpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leareng-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: leareng
      DB_PASSWORD: learengpassword
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/leareng?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-this}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: leareng-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mysql_data:

