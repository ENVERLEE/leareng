<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - Leareng</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <h1>비밀번호 재설정</h1>
        <div id="resetPasswordForm">
            <form id="resetForm">
                <input type="password" id="newPassword" placeholder="새 비밀번호 (8자 이상)" required>
                <input type="password" id="newPasswordConfirm" placeholder="새 비밀번호 확인" required>
                <button type="submit" class="btn-primary">비밀번호 변경</button>
            </form>
            <div id="resetMessage" class="message"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // URL에서 토큰 추출
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('resetPasswordForm').innerHTML = `
                <div style="text-align: center; padding: 2rem 0;">
                    <div style="font-size: 3rem; color: #ef4444; margin-bottom: 1rem;">✗</div>
                    <h2 style="color: var(--text-primary); margin-bottom: 1rem;">유효하지 않은 링크입니다</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 2rem;">비밀번호 재설정 링크가 올바르지 않거나 만료되었습니다.</p>
                    <a href="login.html" class="btn-primary" style="display: inline-block; text-decoration: none;">로그인 페이지로 이동</a>
                </div>
            `;
        } else {
            document.getElementById('resetForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;
                const messageEl = document.getElementById('resetMessage');

                if (newPassword !== newPasswordConfirm) {
                    messageEl.textContent = '비밀번호가 일치하지 않습니다.';
                    messageEl.className = 'message error';
                    return;
                }

                if (newPassword.length < 8) {
                    messageEl.textContent = '비밀번호는 8자 이상이어야 합니다.';
                    messageEl.className = 'message error';
                    return;
                }

                try {
                    await authManager.resetPassword(token, newPassword);
                    messageEl.textContent = '비밀번호가 성공적으로 변경되었습니다!';
                    messageEl.className = 'message success';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } catch (error) {
                    messageEl.textContent = error.message || '비밀번호 재설정 중 오류가 발생했습니다.';
                    messageEl.className = 'message error';
                }
            });
        }
    </script>
</body>
</html>
