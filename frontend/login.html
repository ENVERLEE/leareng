<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Leareng</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <h1>Leareng</h1>
        
        <div class="auth-tabs">
            <button class="auth-tab-item active" data-tab="login">로그인</button>
            <button class="auth-tab-item" data-tab="register">회원가입</button>
            <button class="auth-tab-item" data-tab="reset">비밀번호 찾기</button>
        </div>

        <!-- 로그인 -->
        <div id="loginTab" class="auth-tab-content active">
            <h2>로그인</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="이메일" required>
                <input type="password" id="loginPassword" placeholder="비밀번호" required>
                <button type="submit" class="btn-primary">로그인</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- 회원가입 -->
        <div id="registerTab" class="auth-tab-content">
            <h2>회원가입</h2>
            <div id="verificationSection" style="display: none;">
                <div style="text-align: center; padding: 1rem 0;">
                    <div style="font-size: 2.5rem; color: #6366F1; margin-bottom: 1rem;">📧</div>
                    <h3 style="color: var(--text-primary); margin-bottom: 0.5rem;">인증 이메일을 확인해주세요</h3>
                    <p id="verificationEmail" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">이메일로 발송된 링크를 클릭하여 인증을 완료해주세요.</p>
                    <button id="resendBtn" class="btn-secondary">인증 이메일 재발송</button>
                </div>
            </div>
            <form id="registerForm" style="display: block;">
                <input type="email" id="registerEmail" placeholder="이메일" required>
                <input type="password" id="registerPassword" placeholder="비밀번호 (8자 이상)" required>
                <input type="password" id="registerPasswordConfirm" placeholder="비밀번호 확인" required>
                <button type="submit" class="btn-primary">가입하기</button>
            </form>
            <div id="registerMessage" class="message"></div>
        </div>

        <!-- 비밀번호 재설정 -->
        <div id="resetTab" class="auth-tab-content">
            <h2>비밀번호 재설정</h2>
            <div id="resetCodeSection" style="display: none;">
                <div style="text-align: center; padding: 1rem 0;">
                    <div style="font-size: 2.5rem; color: #6366F1; margin-bottom: 1rem;">📧</div>
                    <h3 style="color: var(--text-primary); margin-bottom: 0.5rem;">비밀번호 재설정 이메일을 확인해주세요</h3>
                    <p id="resetEmail" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">이메일로 발송된 링크를 클릭하여 비밀번호를 재설정해주세요.</p>
                </div>
            </div>
            <form id="resetForm" style="display: block;">
                <input type="email" id="resetEmailInput" placeholder="이메일" required>
                <button type="submit" class="btn-primary">비밀번호 재설정 링크 받기</button>
            </form>
            <div id="resetMessage" class="message"></div>
        </div>

        <div class="auth-footer">
            <a href="index.html">메인으로 돌아가기</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Tab switching
        document.querySelectorAll('.auth-tab-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.auth-tab-item').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.auth-tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(tab + 'Tab').classList.add('active');
            });
        });
    </script>
</body>
</html>
