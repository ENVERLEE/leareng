<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Leareng</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <h1>Leareng</h1>
        
        <div class="auth-tabs">
            <button class="auth-tab-item active" data-tab="login">로그인</button>
            <button class="auth-tab-item" data-tab="register">회원가입</button>
            <button class="auth-tab-item" data-tab="reset">비밀번호 찾기</button>
        </div>

        <!-- 로그인 -->
        <div id="loginTab" class="auth-tab-content active">
            <h2>로그인</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="이메일" required>
                <input type="password" id="loginPassword" placeholder="비밀번호" required>
                <button type="submit" class="btn-primary">로그인</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- 회원가입 -->
        <div id="registerTab" class="auth-tab-content">
            <h2>회원가입</h2>
            <div id="verificationSection" style="display: none;">
                <p id="verificationEmail"></p>
                <input type="text" id="verificationCode" placeholder="인증 코드">
                <button id="verifyBtn" class="btn-primary">인증하기</button>
                <button id="resendBtn" class="btn-secondary">재발송</button>
            </div>
            <form id="registerForm" style="display: block;">
                <input type="email" id="registerEmail" placeholder="이메일" required>
                <input type="password" id="registerPassword" placeholder="비밀번호 (8자 이상)" required>
                <input type="password" id="registerPasswordConfirm" placeholder="비밀번호 확인" required>
                <button type="submit" class="btn-primary">가입하기</button>
            </form>
            <div id="registerMessage" class="message"></div>
        </div>

        <!-- 비밀번호 재설정 -->
        <div id="resetTab" class="auth-tab-content">
            <h2>비밀번호 재설정</h2>
            <div id="resetCodeSection" style="display: none;">
                <p id="resetEmail"></p>
                <input type="text" id="resetCode" placeholder="인증 코드">
                <input type="password" id="newPassword" placeholder="새 비밀번호 (8자 이상)">
                <input type="password" id="newPasswordConfirm" placeholder="새 비밀번호 확인">
                <button id="resetPasswordBtn" class="btn-primary">비밀번호 변경</button>
            </div>
            <form id="resetForm" style="display: block;">
                <input type="email" id="resetEmailInput" placeholder="이메일" required>
                <button type="submit" class="btn-primary">인증 코드 받기</button>
            </form>
            <div id="resetMessage" class="message"></div>
        </div>

        <div class="auth-footer">
            <a href="index.html">메인으로 돌아가기</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Tab switching
        document.querySelectorAll('.auth-tab-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.auth-tab-item').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.auth-tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(tab + 'Tab').classList.add('active');
            });
        });
    </script>
</body>
</html>
