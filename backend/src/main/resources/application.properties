# Server Configuration
# Railway, Render 등에서는 PORT 환경 변수를 사용
server.port=${PORT:8080}

# Oracle Cloud Autonomous Database Configuration
# TLS 인증 사용 (TCPS 프로토콜, SSL 서버 DN 매칭 활성화)
# 환경 변수로 설정 필요:
# 중요: URL에 공백이 있으면 안 됩니다! description= 뒤의 공백을 제거하세요
# SPRING_DATASOURCE_URL=jdbc:oracle:thin:@(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.ap-chuncheon-1.oraclecloud.com))(connect_data=(service_name=gcb3601657097fa_learningeng_high.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))
# 참고: URL 형식은 "jdbc:oracle:thin:@" + CONNECT_STRING 형식입니다 (공백 없이!)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Oracle TLS/SSL Configuration (TLS 인증 사용 시)
# TLS를 사용하는 경우 다음 속성들이 자동으로 처리됩니다 (JDBC 12.2.0.1 이상)
# mTLS를 사용하는 경우 전자 지갑 경로를 설정해야 합니다:
# spring.datasource.oracle.net.ssl_server_dn_match=true
# spring.datasource.oracle.net.wallet_location=/path/to/wallet

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Oracle specific: Boolean types are mapped to NUMBER(1) automatically by Hibernate
# Note: Hibernate automatically detects Oracle dialect, no need to specify explicitly

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_ADDRESS:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY:your-secret-key-change-this-in-production}
jwt.expiration=86400000

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
# 배포 시 프론트엔드 도메인을 추가하세요
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:8080,http://localhost:3000}

# Frontend URL Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:80}

# Backend URL Configuration (for email links)
app.backend.url=${BACKEND_URL:http://localhost:8080}

# Logging
logging.level.com.leareng=INFO
logging.level.com.leareng.service=INFO

